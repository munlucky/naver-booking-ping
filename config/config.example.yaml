# Booking Ping Configuration

# ntfy settings - https://ntfy.sh
ntfy:
  serverUrl: "${NTFY_SERVER_URL:-https://ntfy.sh}"
  # Generate a random topic name for security
  topic: "${NTFY_TOPIC}"
  priority: "${NTFY_PRIORITY:-high}"
  tags: ["${NTFY_TAG_1:-bell}", "${NTFY_TAG_2:-calendar}"]
  # Heartbeat topic for daily status check (optional)
  heartbeatTopic: "${NTFY_HEARTBEAT_TOPIC}"

# Scheduler settings
scheduler:
  baseIntervalMs: ${CHECK_INTERVAL_CLOSED_MS:-5000}   # 5 seconds base interval when CLOSED
  jitterRatio: ${SCHEDULER_JITTER_RATIO:-0.15}        # one-sided jitter (4.25-5 seconds with defaults)

# Browser settings
browser:
  headless: true
  userAgent: "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"
  timeoutMs: 30000           # 30 seconds timeout for page load
  captureEvidenceScreenshots: false  # Set true only when visual evidence is explicitly needed
  viewport: { "width": 390, "height": 844 }
  locale: "ko-KR"
  timezoneId: "Asia/Seoul"
  storageStatePath: "./data/browser-storage-state.json"
  launchArgs: ["--disable-blink-features=AutomationControlled", "--lang=ko-KR"]
  stealth: true

# Logging settings
logging:
  level: "INFO"              # DEBUG, INFO, WARN, ERROR
  file: "./logs/app.log"

# Monitoring targets
targets:
  - kind: "naver-booking"
    name: "${NAVER_BOOKING_TARGET_NAME}"
    # Replace with your actual Naver booking URL
    urlInput: "${NAVER_BOOKING_URL}"
    enabled: true
    policy: "${NAVER_BOOKING_POLICY:-AB}"            # Rules: A (booking link), B (booking button)

  - kind: "flight-price"
    name: "Sydney Direct Flight"
    enabled: false
    provider: "skyscanner"
    priceQuery:
      origin: "ICN"
      destination: "SYD"
      departureDate: "2026-12-17"
      returnDate: "2026-12-26"
      adults: 2
      children: 0
      cabinClass: "economy"
      directOnly: true
      airlines: ["KE", "OZ"]
      currency: "KRW"

# To add more targets, copy one of the above blocks with different values
